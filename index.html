<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap');
  body { margin:0; overflow:hidden; background:#000; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.008);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 35, 65);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.6;

const ring = new THREE.Mesh(new THREE.RingGeometry(8,13,64), new THREE.MeshBasicMaterial({ color:0xffeb3b, side:THREE.DoubleSide }));
ring.rotation.x = Math.PI/2; scene.add(ring);
const ringGlow = new THREE.Mesh(new THREE.RingGeometry(13,16,64), new THREE.MeshBasicMaterial({ color:0xffeb3b, transparent:true, opacity:0.35, side:THREE.DoubleSide }));
ringGlow.rotation.x = Math.PI/2; ringGlow.position.y=-0.2; scene.add(ringGlow);
scene.add(new THREE.Mesh(new THREE.CylinderGeometry(8,8,3,64), new THREE.MeshStandardMaterial({ color:0x111111 })));
scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const starGeo = new THREE.BufferGeometry();
const pos = new Float32Array(12000*3);
for(let i=0;i<pos.length;i++) pos[i]=(Math.random()-0.5)*400;
starGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.6, transparent:true, opacity:0.8 })));

function createTextSprite(text){
  const canvas = document.createElement('canvas'); canvas.width=1024; canvas.height=256;
  const ctx = canvas.getContext('2d');
  ctx.font="bold 58px 'Dancing Script', cursive"; ctx.fillStyle="#ffffff"; ctx.shadowColor="#ffeb3b"; ctx.shadowBlur=20; ctx.textAlign="center";
  ctx.fillText(text, 512, 150);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(canvas), transparent:true }));
  sprite.scale.set(18,4.5,1); return sprite;
}
function createSunflowerSprite(){
  const canvas = document.createElement('canvas'); canvas.width=256; canvas.height=256;
  const ctx=canvas.getContext('2d'); ctx.font="200px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("🌻",128,148);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(canvas) }));
  s.scale.set(4+Math.random()*5,4+Math.random()*5,1); return s;
}
const frases = ["Eres para mi","Eres luz en mis dias","Flores para ti","Eres mi sol","Un detalle amarillo","Eres muy especial","Solo para ti","Flores para siempre","Eres hermosa","Te quiero mucho","Alegrias mis dias","Mi todo","Un amor amarillo","Eres mi alegria"];
const galaxyGroup = new THREE.Group(); scene.add(galaxyGroup);
for(let i=0;i<160;i++){
  const radius = Math.pow(Math.random(),0.7)*85 + 12;
  const angle = (i%3/3)*Math.PI*2 + radius*0.18;
  const x = Math.cos(angle)*radius + (Math.random()-0.5)*6;
  const z = Math.sin(angle)*radius + (Math.random()-0.5)*6;
  const y = (Math.random()-0.5)*12;
  const obj = i%3===0? createSunflowerSprite() : createTextSprite(frases[i%frases.length]);
  obj.position.set(x,y,z); galaxyGroup.add(obj);
}
function animate(){ requestAnimationFrame(animate); galaxyGroup.rotation.y+=0.0015; ring.rotation.z+=0.01; controls.update(); renderer.render(scene,camera); } animate();
window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
